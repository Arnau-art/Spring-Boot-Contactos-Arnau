<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>

<body>
    <div class="auth__tema">
        <th:block th:replace="~{fragments/layout :: selectorTema}"></th:block>
    </div>

    <main class="auth">
        <div class="card auth__card">
            <div class="auth__logo" aria-hidden="true">✉</div>
            <h1>Agenda Postal</h1>
            <p class="muted">Inicia sesión para continuar</p>

            <div class="alert alert--error" role="alert" th:if="${param.error != null}">
                Correo electrónico o contraseña incorrectos.
            </div>
            <div class="alert alert--success" role="status" th:if="${param.logout != null}">
                Has cerrado la sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post" data-cargando>
                <div class="form-group">
                    <label for="username">Correo electrónico</label>
                    <input class="input" type="email" id="username" name="username" autocomplete="username" required
                        autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input class="input" type="password" id="password" name="password" autocomplete="current-password"
                        required>
                </div>
                <button type="submit" class="btn btn--primary btn--block"
                    data-texto-cargando="Entrando…">Entrar</button>
            </form>
        </div>
    </main>
</body>

</html>
