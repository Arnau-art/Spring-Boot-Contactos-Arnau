<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: head('Nuevo usuario')}"></head>

<body>
    <header th:replace="~{fragments/layout :: navbar('usuario')}"></header>

    <main class="container container--narrow">
        <div th:replace="~{fragments/layout :: mensajes}"></div>

        <div class="page-header">
            <h1>Nuevo usuario</h1>
        </div>

        <div class="card">
            <form th:object="${usuarioForm}" th:action="@{/usuarios/nuevo}" method="post" novalidate data-cargando>

                <div class="alert alert--error" role="alert" th:if="${#fields.hasErrors('*')}">
                    Revisa los campos marcados en rojo.
                </div>

                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input class="input" type="text" id="name" maxlength="255" th:field="*{name}"
                        th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" autofocus>
                    <p class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input class="input" type="email" id="email" maxlength="180" th:field="*{email}" autocomplete="off"
                        th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                    <p class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input class="input" type="password" id="password" maxlength="72" th:field="*{password}"
                        autocomplete="new-password" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                    <p class="muted" style="font-size:.85rem;margin:.35rem 0 0">Entre 8 y 72 caracteres.</p>
                    <p class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>

                <div class="form-group">
                    <label for="confirmarPassword">Repite la contraseña</label>
                    <input class="input" type="password" id="confirmarPassword" maxlength="72"
                        th:field="*{confirmarPassword}" autocomplete="new-password"
                        th:classappend="${#fields.hasErrors('confirmarPassword')} ? 'is-invalid'">
                    <p class="field-error" th:if="${#fields.hasErrors('confirmarPassword')}"
                        th:errors="*{confirmarPassword}"></p>
                </div>

                <div class="form-actions">
                    <a class="btn btn--secondary" th:href="@{/contactos}">Cancelar</a>
                    <button type="submit" class="btn btn--primary" data-texto-cargando="Creando…">Crear usuario</button>
                </div>
            </form>
        </div>
    </main>
</body>

</html>
